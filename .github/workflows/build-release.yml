name: Build & Release

on:
  # Manual build: pick a version tag (empty = "dev") and optional
  # Blocky/VictoriaMetrics versions to bake into the image.
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. v1.0.0). Empty = "dev"'
        required: false
        type: string
        default: ''
      blocky_version:
        description: 'Blocky version to build (Dockerfile ARG BLOCKY_VERSION)'
        required: false
        type: string
        default: 'v0.34.0'
      vm_version:
        description: 'VictoriaMetrics version to build (Dockerfile ARG VM_VERSION)'
        required: false
        type: string
        default: 'v1.113.0'
  # Release: push a tag like v1.2.3 (or v1.2.3-beta) → build, tag the image
  # with semver tags + latest (stable only), and create a GitHub Release.
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/<owner>/<repo> — e.g. ghcr.io/paradox-sp/wg-easy-blocky
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decide the tag set:
      #   - tag push  → the tag itself (v1.2.3), plus `latest` for stable releases
      #   - manual    → the version input, or `dev` when left empty
      - name: Prepare tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_stable=false" >> "$GITHUB_OUTPUT"
            fi
          else
            VERSION="${{ inputs.version }}"
            [ -z "$VERSION" ] && VERSION="dev"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.tags.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.tags.outputs.is_stable }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BLOCKY_VERSION=${{ inputs.blocky_version || 'v0.34.0' }}
            VM_VERSION=${{ inputs.vm_version || 'v1.113.0' }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.tags.outputs.tag }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          printf 'Docker image: `%s:%s`\n\n' "${{ env.IMAGE }}" "$TAG" > notes.md
          gh release create "$TAG" --notes-file notes.md --title "$TAG"