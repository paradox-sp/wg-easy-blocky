name: Build & Release

on:
  # Manual build: pick a version tag (empty = "dev") and optional
  # Blocky/VictoriaMetrics versions to bake into the image.
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. v1.0.0). Empty = "dev"'
        required: false
        type: string
        default: ''
      blocky_version:
        description: 'Blocky version to build (Dockerfile ARG BLOCKY_VERSION)'
        required: false
        type: string
        default: 'v0.34.0'
      vm_version:
        description: 'VictoriaMetrics version to build (Dockerfile ARG VM_VERSION)'
        required: false
        type: string
        default: 'v1.113.0'
  # Release: push a tag like v1.2.3 (or v1.2.3-beta) → build, tag the image
  # with semver tags + latest (stable only), and create a GitHub Release.
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/<owner>/<repo> — e.g. ghcr.io/paradox-sp/wg-easy-blocky
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Decide the tag set once, share it with every build job:
  #   - tag push  → the tag itself (v1.2.3), plus `latest` for stable releases
  #   - manual    → the version input, or `dev` when left empty
  prepare:
    name: Prepare version info
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      is_stable: ${{ steps.tags.outputs.is_stable }}
    steps:
      - name: Prepare tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_stable=false" >> "$GITHUB_OUTPUT"
            fi
          else
            VERSION="${{ inputs.version }}"
            [ -z "$VERSION" ] && VERSION="dev"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

  # Build one image per architecture, in parallel. Each job pushes its own
  # arch-suffixed tag (e.g. <tag>-amd64 / <tag>-arm64) — no manifest merge,
  # so users pull the tag matching their architecture.
  build:
    name: Build & Push (${{ matrix.platform }})
    needs: prepare
    # Native runners: x64 for amd64, arm64 for arm64. Building linux/arm64 on
    # an x64 runner would run every Dockerfile step through QEMU emulation,
    # which makes the Go compiles (Blocky, VictoriaMetrics, amneziawg) take
    # many hours. ubuntu-24.04-arm is a standard GitHub-hosted runner (GA for
    # public repos; standard runner for private repos since Jan 2026).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}-${{ matrix.suffix }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BLOCKY_VERSION=${{ inputs.blocky_version || 'v0.34.0' }}
            VM_VERSION=${{ inputs.vm_version || 'v1.113.0' }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          # mode=max caches intermediate build stages (the Go compiles for
          # Blocky/VictoriaMetrics/amneziawg) so re-runs are fast; mode=min
          # would only cache the final image layers and rebuild from scratch.
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ needs.prepare.outputs.tag }}-${{ matrix.suffix }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          printf 'Docker image: `%s:%s-amd64` / `%s:%s-arm64`\n\n' \
            "${{ env.IMAGE }}" "$TAG" "${{ env.IMAGE }}" "$TAG" > notes.md
          gh release create "$TAG" --notes-file notes.md --title "$TAG"