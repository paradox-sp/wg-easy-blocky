# VictoriaMetrics Prometheus Scrape Configuration
# This config is used by VictoriaMetrics to scrape metrics from wg-easy and Blocky

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'wg-easy-blocky'
    environment: 'production'

scrape_configs:
  # wg-easy metrics
  # The /metrics endpoint enforces Bearer auth when a metrics password is set.
  # VM_METRICS_TOKEN must equal the wg-easy metrics password when one is configured
  # (VictoriaMetrics substitutes ${ENV_VAR} placeholders from its environment).
  - job_name: 'wg-easy'
    static_configs:
      - targets: ['localhost:51821']
    metrics_path: '/metrics'
    scheme: 'http'
    authorization:
      type: Bearer
      credentials: ${VM_METRICS_TOKEN}

  # Blocky metrics
  - job_name: 'blocky'
    static_configs:
      - targets: ['localhost:4000']
    metrics_path: '/metrics'
    scheme: 'http'

  # VictoriaMetrics self-monitoring
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['localhost:8428']
    metrics_path: '/metrics'
    scheme: 'http'

  # Node Exporter (if running on host)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['host.docker.internal:9100']
  #   metrics_path: '/metrics'
  #   scheme: 'http'